name: Tests

# Render deploys main automatically, so the suite runs on every pull request
# and on main: a red run on a PR means "do not merge".
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System libraries for WeasyPrint (proposal PDFs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Migrations apply and roll back (SQLite)
        env:
          FLASK_APP: run.py
          SECRET_KEY: ci-secret-key
          DATABASE_URL: sqlite:////tmp/ci-migrations.db
        run: |
          flask db upgrade
          flask db downgrade
          flask db upgrade

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider
