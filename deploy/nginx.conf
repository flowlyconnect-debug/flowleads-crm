# Example Nginx configuration for FlowLeads CRM
# Place behind SSL termination (cert paths are deployment-specific).

upstream flowleads_app {
    server app:8000;
}

server {
    listen 80;
    server_name your-domain.example;

    client_max_body_size 10M;

    # Redirect HTTP to HTTPS in production (uncomment when TLS is configured)
    # return 301 https://$host$request_uri;

    location /static/ {
        alias /var/www/flowleads/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://flowleads_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

