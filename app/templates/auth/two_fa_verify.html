{% extends "base.html" %}
{% block title %}Verify 2FA — FlowLeads{% endblock %}
{% block content %}
<div class="card">
  <h1>Verify identity</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <label>{{ form.token.label }}{{ form.token() }}</label>
    {{ form.submit(class="btn") }}
  </form>
</div>
{% endblock %}
