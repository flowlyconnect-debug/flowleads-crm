<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viestien peruutus — FlowLeads</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  {% if success %}
  <h1>Tilaus on peruttu</h1>
  <p>Et saa enää näitä sähköpostiviestejä.</p>
  {% else %}
  <h1>Peruutus epäonnistui</h1>
  <p>Linkki on virheellinen tai vanhentunut.</p>
  {% endif %}
</body>
</html>
