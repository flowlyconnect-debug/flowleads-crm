databases:
  - name: flowleads-db
    plan: free

services:
  - type: web
    name: flowleads-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    releaseCommand: flask db upgrade
    startCommand: gunicorn run:app --workers 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
