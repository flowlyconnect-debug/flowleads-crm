databases:
  - name: flowleads-db
    plan: free

services:
  - type: web
    name: flowleads-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    releaseCommand: flask db upgrade
    startCommand: flask db upgrade && gunicorn run:app --workers 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: worker
    name: flowleads-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask run-scheduler
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: flowleads-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: flowleads-crm
          type: web
          envVarKey: SECRET_KEY
      - key: N8N_MASTER_SECRET
        fromService:
          name: flowleads-crm
          type: web
          envVarKey: N8N_MASTER_SECRET
